name: Deploy

# Publishes main to GitHub Pages (https://lukaszkalnik.github.io/astronomy/).
# Pages source must be set to "GitHub Actions" (Settings → Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a queued one waits instead of cancelling a running
# deployment halfway.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Full CI (audit, format, lint, typecheck, tests, build) with the Pages base
  # path. If anything fails, the deploy job does not run.
  check:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      base-path: /astronomy/
    permissions:
      contents: read

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Write scopes only here (CLAUDE.md "Security & privacy").
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
