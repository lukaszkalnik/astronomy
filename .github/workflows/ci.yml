name: CI

on:
  push:
  pull_request:
  # Reused by deploy.yml, so the deployed dist/ is exactly the one that passed
  # these checks.
  workflow_call:
    inputs:
      base-path:
        description: Public base path for the build (Vite `base`).
        type: string
        default: /

# A newer push to the same branch (or PR) cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (tag in the comment); Dependabot
      # keeps them up to date. See CLAUDE.md "Security & privacy".
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # Full audit (dev deps run in CI and the build); fails on high/critical.
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
      - run: npm run build
        env:
          # Empty on push/pull_request, then the default "/" applies.
          BASE_PATH: ${{ inputs.base-path || '/' }}

      # E2E smoke tests against the dist/ just built (CI=true makes the
      # Playwright webServer skip its own build), with the same base path.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          BASE_PATH: ${{ inputs.base-path || '/' }}

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
